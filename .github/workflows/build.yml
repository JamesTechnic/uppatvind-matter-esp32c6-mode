name: Build firmware

# Buduje projekt dla ESP32-C6 na oficjalnym obrazie Espressif
# (ESP-IDF v6.0.2 + esp-matter release/v1.6). Nie używa żadnych sekretów.
on:
  push:
    branches: [main, fix/build-and-thread-start]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      # Obraz z IDF + esp-matter jest duży – zwalniamy miejsce na runnerze.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          df -h /

      - name: Build (esp32c6)
        run: |
          docker run --rm -v "$PWD":/project -w /project \
            espressif/esp-matter:release-v1.6 \
            bash -c "cd /project && set -o pipefail && echo \"::notice title=Toolchain::IDF \$(cat /opt/espressif/esp-idf-commit.txt 2>/dev/null) \$(idf.py --version 2>&1 | tail -1), esp-matter \$(cat /opt/espressif/esp-matter-commit.txt 2>/dev/null), connectedhomeip \$(cat /opt/espressif/connectedhomeip-commit.txt 2>/dev/null)\" && idf.py set-target esp32c6 2>&1 | tee /project/build.log && idf.py build 2>&1 | tee -a /project/build.log"

      # Przy błędzie wypisz linie z błędami jako adnotację (widoczną na stronie
      # runa i w API), żeby nie trzeba było przeklejać całego logu.
      - name: Report build errors
        if: failure()
        run: |
          [ -f build.log ] || exit 0
          MSG=$(grep -n -E "error:|CMake Error|undefined reference|ninja: build stopped" -A3 build.log | grep -v "riscv32-esp-elf-g" | cut -c1-300 | head -70 | sed -e 's/%/%25/g' -e 's/\r//g' | sed -e ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Build errors::${MSG}"
          echo "--- last 40 lines ---"; tail -40 build.log

      - name: Collect firmware files
        if: success()
        run: |
          mkdir -p out
          cp build/uppatvind_matter.bin build/flasher_args.json out/
          cp build/bootloader/bootloader.bin out/
          cp build/partition_table/partition-table.bin out/
          [ -f build/ota_data_initial.bin ] && cp build/ota_data_initial.bin out/ || true
          ls -la out

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: uppatvind-esp32c6-firmware
          path: out/
